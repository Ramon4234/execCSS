<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página para contatos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="header">
            <div class="menu">
            <h1>Meu Portfólio</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="contato.html">Contatos</a>
            </nav>
        </div>
    </header>
<main>
    <section class="contato">
        <div class="form-container"> 
        <h2>Entre em contato</h2>
        <p>Preencha o formulário em baixo para enviar sua mensagem.<br><br> </p>
        <form>
            <label for="nome">Nome:</label><br>
            <input type="text" id="nome" name="nome"  placeholder="Digite seu nome" required><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required><br><br>

            <label for="mensagem">Mensagem:</label><br>
          <textarea name="mensagem" id="mensagem" rows="4" cols="50" placeholder="Digite sua mensagem" required></textarea><br><br>
       <button type="submit">Enviar mensagem </button>
        </form>
        </div>
        </section>
</main>
    
    
    



<footer>

            Todos os Direitos Reservados</p>
        <p>Desenvolvimento com HTML e CSS</p>
        <p>Entre em contato</p> 
       
</footer>

</body>

</html>
